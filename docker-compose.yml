services:
  app:
    build:
      context: .
      args:
        VITE_REVERB_APP_KEY: "sketchrushkey"
        VITE_REVERB_HOST: "localhost"
        VITE_REVERB_PORT: "8080"
        VITE_REVERB_SCHEME: "http"
    volumes:
      - ./storage:/var/www/html/storage
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PASSWORD: root
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/html/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  queue:
    build: .
    command: php artisan queue:work --sleep=1 --tries=3
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PASSWORD: root
      REDIS_HOST: redis
    depends_on:
      - mysql
      - redis

  reverb:
    build: .
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      - redis
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sketchrush
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  mysql-data:
